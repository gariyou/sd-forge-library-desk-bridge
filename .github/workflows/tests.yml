name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check (Forge Neo runs on Python 3.10+)
        run: python -m compileall -q bridge_core.py local_connection.py scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
